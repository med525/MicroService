# Service Identification
spring.application.name=property-service
server.port=8082

# Eureka Discovery
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true

# Database Configuration (you can adapt the file name/location)
spring.h2.console.enabled=true
spring.h2.console.path=/h2
spring.datasource.url=jdbc:h2:file:./Database/Data/property;AUTO_SERVER=TRUE
spring.datasource.username=se
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Keycloak Resource Server (JWT)
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9090/realms/maghrebia-realm
