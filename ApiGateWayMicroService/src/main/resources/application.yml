spring:
  application:
    name: ApiGetWay

  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true  # recommended
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/users/**
        - id: property-service
          uri: lb://property-service
          predicates:
            - Path=/properties/**
        - id: incident-service
          uri: lb://incident-service
          predicates:
            - Path=/incidents/**

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9090/realms/maghrebia-realm

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    reactor.netty.http.client: DEBUG

server:
  port: 8090

eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://localhost:8761/eureka/

