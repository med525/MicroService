<div class="max-w-6xl mx-auto px-4 py-8">
    <h2 class="text-2xl font-semibold mb-6 text-gray-800 flex items-center gap-2">
      🏘️ <span>My Properties</span>
    </h2>
  
    <div *ngIf="loading" class="text-blue-600 font-medium mb-4">Loading...</div>
    <div *ngIf="errorMessage" class="text-red-500 font-medium mb-4">{{ errorMessage }}</div>
  
    <div class="overflow-x-auto shadow rounded-lg border border-gray-200" *ngIf="properties.length > 0">
      <table class="min-w-full bg-white divide-y divide-gray-200">
        <thead class="bg-gray-100 text-gray-600 uppercase text-sm">
          <tr>
            <th class="px-4 py-3 text-left">ID</th>
            <th class="px-4 py-3 text-left">Title</th>
            <th class="px-4 py-3 text-left">Location</th>
            <th class="px-4 py-3 text-left">Type</th>
            <th class="px-4 py-3 text-left">Value</th>
            <th class="px-4 py-3 text-left">Actions</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-gray-100">
          <tr *ngFor="let property of properties" class="hover:bg-gray-50 transition">
            <td class="px-4 py-2">{{ property.id }}</td>
            <td class="px-4 py-2">{{ property.title }}</td>
            <td class="px-4 py-2">{{ property.location }}</td>
            <td class="px-4 py-2">{{ property.type }}</td>
            <td class="px-4 py-2">{{ property.value | currency }}</td>
            <td class="px-4 py-2 flex gap-2">
              <button (click)="onEdit(property)" class="bg-yellow-500 hover:bg-yellow-600 text-white px-3 py-1 rounded text-sm">
                ✏️ Edit
              </button>
              <button (click)="onDelete(property.id)" class="bg-red-500 hover:bg-red-600 text-white px-3 py-1 rounded text-sm">
                🗑️ Delete
              </button>
            </td>
          </tr>
        </tbody>
      </table>
      <div *ngIf="isEditing" class="mt-6 bg-gray-100 p-4 rounded-lg shadow">
        <h3 class="text-xl font-semibold mb-4">🛠️ Update Property</h3>
      
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <input [(ngModel)]="updateForm.title" class="border p-2 rounded" placeholder="Title" />
          <input [(ngModel)]="updateForm.location" class="border p-2 rounded" placeholder="Location" />
          <input [(ngModel)]="updateForm.type" class="border p-2 rounded" placeholder="Type" />
          <input [(ngModel)]="updateForm.value" type="number" class="border p-2 rounded" placeholder="Value" />
        </div>
      
        <div class="mt-4 flex gap-4">
          <button (click)="submitUpdate()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded">
            ✅ Save Changes
          </button>
          <button (click)="cancelEdit()" class="bg-gray-400 hover:bg-gray-500 text-white px-4 py-2 rounded">
            ❌ Cancel
          </button>
        </div>
      </div>
      
    </div>
  
    <div *ngIf="!loading && properties.length === 0" class="text-gray-500 mt-4">
      No properties found.
    </div>
  </div>
