<div class="p-6">
    <h2 class="text-2xl font-bold mb-4 text-blue-700">Keycloak Users</h2>
  
    <div *ngIf="successMessage" class="mb-4 text-green-600 bg-green-100 border border-green-300 p-2 rounded">
      {{ successMessage }}
    </div>
    <div *ngIf="errorMessage" class="mb-4 text-red-600 bg-red-100 border border-red-300 p-2 rounded">
      {{ errorMessage }}
    </div>
  
    <table class="w-full text-sm border rounded-lg overflow-hidden shadow-sm bg-white mb-6">
      <thead class="bg-blue-50">
        <tr>
          <th class="p-3 text-left border">Username</th>
          <th class="p-3 text-left border">Email</th>
          <th class="p-3 text-left border">First Name</th>
          <th class="p-3 text-left border">Last Name</th>
          <th class="p-3 text-center border">Enabled</th>
          <th class="p-3 text-center border">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let user of users" class="hover:bg-gray-50">
          <td class="p-2 border">{{ user.username }}</td>
          <td class="p-2 border">{{ user.email }}</td>
          <td class="p-2 border">{{ user.firstName }}</td>
          <td class="p-2 border">{{ user.lastName }}</td>
          <td class="p-2 border text-center">{{ user.enabled ? '✔️' : '❌' }}</td>
          <td class="p-2 border text-center space-x-2">
            <button (click)="selectUser(user)" class="text-blue-600 hover:underline">Edit</button>
            <button (click)="deleteUser(user.id)" class="text-red-600 hover:underline">Delete</button>
          </td>
        </tr>
      </tbody>
    </table>
  
    <div *ngIf="selectedUser" class="bg-gray-50 border p-4 rounded-lg shadow-sm max-w-xl mx-auto">
      <h3 class="text-lg font-semibold mb-3">✏️ Update User: {{ selectedUser.username }}</h3>
      <form (ngSubmit)="updateUser()" class="grid gap-3">
        <input type="email" [(ngModel)]="updateForm.email" name="email" placeholder="Email" required class="p-2 border rounded w-full">
        <input type="text" [(ngModel)]="updateForm.firstName" name="firstName" placeholder="First Name" class="p-2 border rounded w-full">
        <input type="text" [(ngModel)]="updateForm.lastName" name="lastName" placeholder="Last Name" class="p-2 border rounded w-full">
        <label class="flex items-center space-x-2">
          <input type="checkbox" [(ngModel)]="updateForm.enabled" name="enabled">
          <span class="text-sm">Enabled</span>
        </label>
        <div class="flex justify-end space-x-2">
          <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">💾 Save</button>
          <button type="button" (click)="cancelEdit()" class="px-4 py-2 bg-gray-300 text-gray-800 rounded hover:bg-gray-400">✖ Cancel</button>
        </div>
      </form>
    </div>
  </div>
