<div class="max-w-3xl mx-auto p-4">
    <h2 class="text-xl font-bold mb-4">📝 Incidents for Property #{{ propertyId }}</h2>
  
    <div *ngIf="errorMessage" class="text-red-600">{{ errorMessage }}</div>
    <div *ngIf="successMessage" class="text-green-600">{{ successMessage }}</div>
  
    <div class="mb-4">
      <textarea [(ngModel)]="description"
                placeholder="Describe the incident"
                class="w-full border p-2 rounded shadow-sm"></textarea>
      <button (click)="addIncident()"
              class="mt-2 bg-blue-600 text-white py-2 px-4 rounded hover:bg-blue-700">
        ➕ Report Incident
      </button>
    </div>
  
    <div *ngIf="incidents.length === 0" class="text-gray-500">No incidents found.</div>
  
    <ul class="space-y-3" *ngIf="incidents.length > 0">
      <li *ngFor="let incident of incidents" class="border p-3 rounded bg-white shadow-sm">
        <div class="font-semibold text-gray-800">📌 {{ incident.description }}</div>
        <div class="text-sm text-gray-500">🕒 {{ incident.timestamp | date:'medium' }}</div>
      </li>
    </ul>
  </div>
