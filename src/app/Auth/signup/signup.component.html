<div class="flex min-h-screen items-center justify-center bg-gray-100 px-4 py-12">
    <div class="w-full max-w-md space-y-8 p-8 bg-white shadow-xl rounded-xl">
      <div class="text-center">
        <h2 class="text-3xl font-extrabold text-gray-900">Create Your Account</h2>
        <p class="mt-2 text-sm text-gray-600">Sign up to get started</p>
      </div>
      <div *ngIf="errorMessage" class="mb-4 p-4 rounded-md bg-red-100 border border-red-400 text-red-700 text-sm">
        ❌ {{ errorMessage }}
      </div>
      
      <form (ngSubmit)="signup()" class="space-y-6">
        <div>
          <label for="name" class="block text-sm font-medium text-gray-700">Name</label>
          <input
            [(ngModel)]="name"
            name="name"
            id="name"
            type="text"
            required
            class="mt-1 w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500"
          />
        </div>

        <div>
          <label for="firstName" class="block text-sm font-medium text-gray-700">First Name</label>
          <input
            [(ngModel)]="firstName"
            name="firstName"
            id="firstName"
            type="text"
            required
            class="mt-1 w-full px-4 py-2 border border-gray-300 rounded-md"
          />
        </div>
        
        <div>
          <label for="lastName" class="block text-sm font-medium text-gray-700">Last Name</label>
          <input
            [(ngModel)]="lastName"
            name="lastName"
            id="lastName"
            type="text"
            required
            class="mt-1 w-full px-4 py-2 border border-gray-300 rounded-md"
          />
        </div>        
  
        <div>
          <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
          <input
            [(ngModel)]="email"
            name="email"
            id="email"
            type="email"
            required
            class="mt-1 w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500"
          />
        </div>
  
        <div>
          <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
          <input
            [(ngModel)]="password"
            name="password"
            id="password"
            type="password"
            required
            class="mt-1 w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500"
          />
        </div>
  
        <div>
          <button
            type="submit"
            class="w-full flex justify-center py-2 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-blue-600 hover:bg-blue-700 transition duration-200"
          >
            Create Account
          </button>
        </div>
  
        <div class="text-sm text-center text-gray-600">
          Already have an account?
          <a routerLink="/login" class="text-blue-600 hover:underline">Log in</a>
        </div>
      </form>
    </div>
  </div>
