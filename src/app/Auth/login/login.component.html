<div class="flex min-h-screen items-center justify-center bg-gray-100 px-4 py-12">
    <div class="w-full max-w-md space-y-8 p-8 bg-white shadow-xl rounded-xl">
      <div class="text-center">
        <h2 class="text-3xl font-extrabold text-gray-900">Welcome Back</h2>
        <p class="mt-2 text-sm text-gray-600">Please sign in to your account</p>
      </div>
      <div *ngIf="errorMessage" class="mb-4 p-4 rounded-md bg-red-100 border border-red-400 text-red-700 text-sm shadow-sm">
        <span class="font-semibold">❌ Login failed:</span>
        {{ errorMessage }}
      </div>
      
      
      <form (ngSubmit)="login()" class="space-y-6">
        <div>
          <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
          <input
            [(ngModel)]="email"
            name="email"
            id="email"
            type="email"
            required
            class="mt-1 w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500"
          />
        </div>
  
        <div>
          <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
          <input
            [(ngModel)]="password"
            name="password"
            id="password"
            type="password"
            required
            class="mt-1 w-full px-4 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500"
          />
        </div>
  
        <div class="flex items-center justify-between">
          <div class="flex items-center">
            <input id="remember" type="checkbox" class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded" />
            <label for="remember" class="ml-2 block text-sm text-gray-900">Remember me</label>
          </div>
          <div class="text-sm">
            <a href="#" class="font-medium text-blue-600 hover:text-blue-500">Forgot password?</a>
          </div>
        </div>
  
        <div>
          <button
            type="submit"
            class="w-full flex justify-center py-2 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-blue-600 hover:bg-blue-700 transition duration-200"
          >
            Sign in
          </button>
        </div>
      </form>
    </div>
  </div>
